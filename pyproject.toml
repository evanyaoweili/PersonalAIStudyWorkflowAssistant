[project]
name = "study-assistant"
version = "0.1.0"
description = "Personal AI Study Workflow Assistant - CMU AI Agent Course Capstone"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
study-assistant = "study_assistant.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
